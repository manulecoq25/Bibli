<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bibli — livres libres, en français et en anglais</title>
<meta name="description" content="Bibli : une bibliothèque de livres du domaine public, gratuits, à lire sur ton téléphone, même avec peu de données. Public-domain books, free, in French and English.">
<meta name="theme-color" content="#f6efe3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#f6efe3;--paper2:#efe5d3;--ink:#2a2117;--ink2:#6b5d4c;--line:#dccfb8;--accent:#1d5c8a;--accent2:#2a7a62;--card:#fffaf0;
  --rs:17px;--rf:Georgia,"Times New Roman",serif;
}
[data-theme=dark]{--paper:#15130f;--paper2:#1f1b15;--ink:#ece3d3;--ink2:#a9987f;--line:#33291d;--accent:#6fb2e6;--accent2:#5fb3a0;--card:#1d1913}
[data-theme=sepia]{--paper:#e9dcc2;--paper2:#dfd0b2;--ink:#3b2e1e;--ink2:#705d44;--line:#cdbb98;--card:#f1e5cc}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.logo{font:700 22px/1 var(--rf);letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:4px 10px 10px 4px;background:var(--accent);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;left:5px;top:5px;width:12px;height:2px;background:var(--paper);box-shadow:0 4px 0 var(--paper),0 8px 0 var(--paper)}
.spacer{flex:1}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;background:var(--card)}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{padding:16px;max-width:860px;margin:0 auto}
h1{font:700 30px/1.15 var(--rf);margin:8px 0 6px;letter-spacing:-.5px}h2{font:700 20px/1.2 var(--rf);margin:26px 0 10px}
.sub{color:var(--ink2);margin:0 0 14px}
.search{display:flex;gap:8px;margin:14px 0}
.search input{flex:1;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips .pill{white-space:nowrap;flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}.row .card{flex:0 0 150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:170px;position:relative;overflow:hidden}
.cover{height:84px;border-radius:8px;display:flex;align-items:flex-end;padding:8px;font:700 14px/1.15 var(--rf);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);background:linear-gradient(160deg,var(--c1),var(--c2))}
.card .t{font:600 14px/1.25 var(--rf)}.card .a{font-size:12px;color:var(--ink2)}
.card .m{font-size:11px;color:var(--ink2);margin-top:auto;display:flex;gap:6px;align-items:center}
.lang{font-size:10px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 4px;letter-spacing:.5px}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;position:absolute;left:0;right:0;bottom:0}.prog b{display:block;height:100%;background:var(--accent2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.empty{color:var(--ink2);text-align:center;padding:40px 10px}
.book-hero{display:flex;gap:16px;align-items:flex-start}.book-hero .cover{width:110px;height:150px;flex:0 0 110px;font-size:16px}
.meta{font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 14px}
.toc{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.toc li a{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}.toc li:first-child a{border-top:0}.toc li a.cur{background:var(--paper2);font-weight:600}
.toc .n{color:var(--ink2);min-width:26px}
.note{font-size:12px;color:var(--ink2);border-top:1px solid var(--line);margin-top:24px;padding-top:12px}
footer{padding:30px 16px;color:var(--ink2);font-size:12px;text-align:center;border-top:1px solid var(--line);margin-top:30px}
/* reader */
body.reading header.top{transform:translateY(0);transition:transform .25s}body.reading.hide header.top{transform:translateY(-100%)}
.rd{font:var(--rs)/1.65 var(--rf);max-width:640px;margin:0 auto;padding:10px 0 80px;hyphens:auto;-webkit-hyphens:auto}
.rd h3{font:700 1.35em/1.2 var(--rf);margin:14px 0 20px;text-align:center}
.rd p{margin:0 0 1em;text-align:justify}.rd p.v{text-align:left;white-space:normal;margin-left:1.2em}
#rdbody>p:first-of-type:not(.v)::first-letter{font-size:2.6em;line-height:.9;float:left;padding:4px 6px 0 0;font-weight:700;color:var(--accent)}
.rdnav{display:flex;gap:10px;justify-content:space-between;margin:30px 0 0}
.rbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:5;transition:transform .25s}
body.hide .rbar{transform:translateY(100%)}
.rbar .pill{padding:7px 11px}.rbar .pct{font-size:12px;color:var(--ink2);margin-left:auto}
.topline{position:fixed;left:0;top:0;height:3px;background:var(--accent);z-index:6;width:0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9;display:flex;align-items:flex-end}
.sheet>div{background:var(--paper);width:100%;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px 24px}
.sheet h2{margin:4px 0 10px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;z-index:10;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
.about p{max-width:640px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font:700 22px/1.1 var(--rf)}
.kpi span{font-size:12px;color:var(--ink2)}
@media (min-width:700px){.card{min-height:190px}.cover{height:100px}}
</style>
</head>
<body>
<div class="topline" id="topline"></div>
<header class="top">
  <a class="logo" href="#/"><i></i>Bibli</a>
  <span class="spacer"></span>
  <a class="pill" href="#/catalogue" data-i="nav_cat"></a>
  <a class="pill" href="#/mine" data-i="nav_mine"></a>
  <button class="pill" id="langbtn" aria-label="Language"></button>
</header>
<main id="app"></main>
<footer id="foot"></footer>
<div class="toast" id="toast"></div>
<script>
// ------------------------------------------------------------ i18n
const I={
 fr:{nav_cat:"Catalogue",nav_mine:"Mes livres",home_h:"Des livres libres, pour ton téléphone.",home_sub:"Des classiques du domaine public, en français et en anglais. Gratuits, sans compte, légers en données, lisibles hors ligne une fois ouverts.",
  search:"Titre, auteur…",continue:"Continuer la lecture",popular:"Les plus lus",new_fr:"En français",new_en:"En anglais",all:"Tous",
  cat_h:"Catalogue",results:n=>`${n} livre${n>1?"s":""}`,none:"Aucun livre ne correspond. Essaie un autre mot.",
  read:"Lire",resume:"Reprendre",chapters:n=>`${n} chapitre${n>1?"s":""}`,words:w=>`${Math.round(w/250)} min de lecture`,
  source:"Source",license:"Domaine public",download:"EPUB (Gutenberg)",toc:"Table des matières",
  prev:"‹ Précédent",next:"Suivant ›",end:"Fin du livre",settings:"Lecture",size:"Taille du texte",theme:"Thème",light:"Clair",sepia:"Sépia",dark:"Sombre",
  bookmark:"Marquer",bookmarked:"Page marquée",mine_h:"Mes livres",mine_sub:"Tes lectures en cours et tes marques, gardées sur ce téléphone.",mine_none:"Tu n'as pas encore ouvert de livre.",
  marks:"Marques",chapter:"Chapitre",about:"À propos",legal:"Droits & domaine public",offline:"Hors ligne : ce chapitre n'est pas encore sur ton téléphone.",
  about_t:"Bibli est une bibliothèque gratuite de livres entrés dans le domaine public : des œuvres dont les auteurs sont morts depuis plus de 70 ans, que chacun peut lire, copier et partager librement. Les textes viennent du Project Gutenberg et sont préparés pour la lecture sur téléphone : chapitres légers, texte qui s'adapte à l'écran, mode sombre, lecture hors ligne. Bibli ne met en ligne aucun livre encore protégé par le droit d'auteur. Si tu penses qu'un texte ne devrait pas être ici, écris-nous.",
  genres:{selfhelp:"Développement personnel",fiction:"Romans & nouvelles",adventure:"Aventure & voyages",children:"Jeunesse",poetry:"Poésie",drama:"Théâtre",philosophy:"Philosophie",history:"Histoire & vies",mystery:"Policier & mystère",romance:"Amour",science:"Sciences",religion:"Spiritualité"},
  langs:{fr:"Français",en:"Anglais"},install:"Ajouter Bibli à l'écran d'accueil pour lire hors ligne."},
 en:{nav_cat:"Catalogue",nav_mine:"My books",home_h:"Free books, made for your phone.",home_sub:"Public-domain classics in French and English. Free, no account, light on data, readable offline once opened.",
  search:"Title, author…",continue:"Continue reading",popular:"Most read",new_fr:"In French",new_en:"In English",all:"All",
  cat_h:"Catalogue",results:n=>`${n} book${n>1?"s":""}`,none:"No book matches. Try another word.",
  read:"Read",resume:"Resume",chapters:n=>`${n} chapter${n>1?"s":""}`,words:w=>`${Math.round(w/250)} min read`,
  source:"Source",license:"Public domain",download:"EPUB (Gutenberg)",toc:"Contents",
  prev:"‹ Previous",next:"Next ›",end:"End of book",settings:"Reading",size:"Text size",theme:"Theme",light:"Light",sepia:"Sepia",dark:"Dark",
  bookmark:"Bookmark",bookmarked:"Bookmarked",mine_h:"My books",mine_sub:"Your current reads and bookmarks, kept on this phone.",mine_none:"You haven't opened a book yet.",
  marks:"Bookmarks",chapter:"Chapter",about:"About",legal:"Rights & public domain",offline:"Offline: this chapter isn't on your phone yet.",
  about_t:"Bibli is a free library of public-domain books: works whose authors died more than 70 years ago, which anyone may read, copy and share. Texts come from Project Gutenberg and are prepared for phone reading: light chapters, text that fits the screen, dark mode, offline reading. Bibli hosts no book still under copyright. If you believe a text should not be here, write to us.",
  genres:{selfhelp:"Personal development",fiction:"Fiction & stories",adventure:"Adventure & travel",children:"Children",poetry:"Poetry",drama:"Drama",philosophy:"Philosophy",history:"History & lives",mystery:"Mystery & crime",romance:"Romance",science:"Science",religion:"Spirituality"},
  langs:{fr:"French",en:"English"},install:"Add Bibli to your home screen to read offline."}
};
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},SS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let L=LS("bibli.lang")||((navigator.language||"fr").slice(0,2)==="en"?"en":"fr");
const t=k=>I[L][k];
const prefs=Object.assign({size:17,theme:"light"},LS("bibli.prefs")||{});
let progress=LS("bibli.progress")||{};   // id -> {ch, at, pct}
let marks=LS("bibli.marks")||{};         // id -> [{ch,y,ts}]
const app=document.getElementById("app"),toastEl=document.getElementById("toast");
let CAT=null,BOOKS={},partCache={};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const cover=b=>`<div class="cover" style="--c1:hsl(${hue(b.title)},45%,42%);--c2:hsl(${(hue(b.title)+40)%360},50%,28%)">${esc(b.title.length>42?b.title.slice(0,40)+"…":b.title)}</div>`;
function applyTheme(){document.documentElement.dataset.theme=prefs.theme;document.documentElement.style.setProperty("--rs",prefs.size+"px");document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.body).getPropertyValue("--paper").trim()}
function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove("on"),1800)}
function setLang(l){L=l;SS("bibli.lang",l);document.documentElement.lang=l;document.getElementById("langbtn").textContent=l==="fr"?"EN":"FR";document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));document.getElementById("foot").innerHTML=`<a href="#/about">${t("about")}</a> · <a href="#/about">${t("legal")}</a> · <a href="https://www.gutenberg.org" rel="noopener">Project Gutenberg</a><br>© 2026 Bibli · ${t("license")}`;route()}
document.getElementById("langbtn").onclick=()=>setLang(L==="fr"?"en":"fr");

async function loadCat(){if(CAT)return CAT;const r=await fetch("data/catalogue.json");CAT=await r.json();CAT.books.forEach(b=>BOOKS[b.id]=b);return CAT}
async function loadPart(id,k){const key=id+"/"+k;if(partCache[key])return partCache[key];const r=await fetch(`data/books/${id}/p${k}.json`);if(!r.ok)throw new Error("part");const j=await r.json();partCache[key]=j;return j}

// ------------------------------------------------------------ views
const card=b=>{const p=progress[b.id];return `<a class="card" href="#/book/${b.id}">${cover(b)}<div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div><div class="m"><span class="lang">${b.lang.toUpperCase()}</span>${t("words")(b.words)}</div>${p?`<div class="prog"><b style="width:${p.pct}%"></b></div>`:""}</a>`};
const row=bs=>`<div class="row">${bs.map(card).join("")}</div>`;

async function home(){const c=await loadCat();const cont=Object.entries(progress).sort((a,b)=>b[1].at-a[1].at).map(([id])=>BOOKS[id]).filter(Boolean).slice(0,8);
 app.innerHTML=`<h1>${t("home_h")}</h1><p class="sub">${t("home_sub")}</p>
 <form class="search" onsubmit="location.hash='#/catalogue?q='+encodeURIComponent(this.q.value);return false"><input name="q" placeholder="${t("search")}" autocomplete="off"></form>
 ${cont.length?`<h2>${t("continue")}</h2>${row(cont)}`:""}
 <h2>${t("popular")}</h2>${row(c.books.slice(0,12))}
 <h2>${t("new_fr")}</h2>${row(c.books.filter(b=>b.lang==="fr").slice(0,12))}
 <h2>${t("new_en")}</h2>${row(c.books.filter(b=>b.lang==="en").slice(0,12))}
 ${Object.keys(t("genres")).map(g=>{const bs=c.books.filter(b=>b.genres.includes(g));return bs.length>=3?`<h2><a href="#/catalogue?g=${g}">${t("genres")[g]} ›</a></h2>${row(bs.slice(0,10))}`:""}).join("")}
 <div class="note">${t("install")}</div>`}

async function catalogue(q){const c=await loadCat();const Q=(q.get("q")||"").trim().toLowerCase(),G=q.get("g")||"",LG=q.get("l")||"";
 const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");const nq=norm(Q);
 let bs=c.books.filter(b=>(!LG||b.lang===LG)&&(!G||b.genres.includes(G))&&(!nq||norm(b.title+" "+b.author).includes(nq)));
 const link=(k,v)=>{const p=new URLSearchParams(q);v?p.set(k,v):p.delete(k);return "#/catalogue?"+p};
 app.innerHTML=`<h1>${t("cat_h")}</h1>
 <form class="search" onsubmit="location.hash='${link("q","")}'.replace(/\\?$/,'')+'&q='+encodeURIComponent(this.q.value);return false"><input name="q" value="${esc(Q)}" placeholder="${t("search")}" autocomplete="off"></form>
 <div class="chips"><a class="pill ${!LG?"on":""}" href="${link("l","")}">${t("all")}</a><a class="pill ${LG==="fr"?"on":""}" href="${link("l","fr")}">${t("langs").fr}</a><a class="pill ${LG==="en"?"on":""}" href="${link("l","en")}">${t("langs").en}</a></div>
 <div class="chips"><a class="pill ${!G?"on":""}" href="${link("g","")}">${t("all")}</a>${Object.keys(t("genres")).map(g=>`<a class="pill ${G===g?"on":""}" href="${link("g",g)}">${t("genres")[g]}</a>`).join("")}</div>
 <p class="sub">${t("results")(bs.length)}</p>${bs.length?`<div class="grid">${bs.map(card).join("")}</div>`:`<div class="empty">${t("none")}</div>`}`}

async function book(id){await loadCat();const b=BOOKS[id];if(!b)return app.innerHTML=`<div class="empty">404</div>`;const p=progress[id];
 app.innerHTML=`<div class="book-hero">${cover(b)}<div><h1>${esc(b.title)}</h1><p class="sub">${esc(b.author)}${b.author_dates&&b.author_dates[0]&&b.author_dates[0][0]?` (${b.author_dates[0][0]}–${b.author_dates[0][1]||""})`:""}</p>
 <div class="meta"><span>${t("langs")[b.lang]||b.lang}</span><span>${t("chapters")(b.chapters.length)}</span><span>${t("words")(b.words)}</span></div>
 <a class="btn" href="#/read/${id}/${p?p.ch:0}">${p?t("resume"):t("read")}</a></div></div>
 <div class="meta" style="margin-top:14px">${b.genres.map(g=>`<a class="pill" href="#/catalogue?g=${g}">${t("genres")[g]||g}</a>`).join("")}</div>
 <h2>${t("toc")}</h2><ol class="toc">${b.chapters.map((c,i)=>`<li><a href="#/read/${id}/${i}" class="${p&&p.ch===i?"cur":""}"><span class="n">${i+1}</span><span>${esc(c||t("chapter")+" "+(i+1))}</span></a></li>`).join("")}</ol>
 <div class="note">${t("source")} : <a href="${b.source_url}" rel="noopener">${b.source}</a> · ${t("license")} · <a href="${b.epub_url}" rel="noopener">${t("download")}</a></div>`}

let rdState=null;
async function read(id,ch){await loadCat();const b=BOOKS[id];if(!b)return app.innerHTML="404";ch=Math.max(0,Math.min(b.chapters.length-1,ch|0));
 const [pk,ci]=b.index[ch];document.body.classList.add("reading");
 app.innerHTML=`<div class="rd"><p class="sub" style="text-align:center">${esc(b.title)}</p><div id="rdbody"><p style="text-align:center;color:var(--ink2)">…</p></div></div>
 <div class="rbar"><a class="pill" href="#/book/${id}">☰</a><button class="pill" id="mk">🔖</button><button class="pill" id="aa">Aa</button><span class="pct" id="pct"></span><a class="pill" href="#/read/${id}/${ch-1}" ${ch===0?"style='visibility:hidden'":""}>‹</a><a class="pill" href="#/read/${id}/${ch+1}" ${ch>=b.chapters.length-1?"style='visibility:hidden'":""}>›</a></div>`;
 let part;try{part=await loadPart(id,pk)}catch(e){document.getElementById("rdbody").innerHTML=`<div class="empty">${t("offline")}</div>`;return}
 const c=part[ci];const last=ch>=b.chapters.length-1;
 document.getElementById("rdbody").innerHTML=`<h3>${esc(c.t||t("chapter")+" "+(ch+1))}</h3>${c.h}<div class="rdnav">${ch>0?`<a class="btn sec" href="#/read/${id}/${ch-1}">${t("prev")}</a>`:"<span></span>"}${last?`<a class="btn sec" href="#/book/${id}">${t("end")}</a>`:`<a class="btn" href="#/read/${id}/${ch+1}">${t("next")}</a>`}</div>`;
 // prefetch next part
 if(!last){const [npk]=b.index[ch+1];if(npk!==pk)loadPart(id,npk).catch(()=>{})}
 const saved=progress[id];const y=saved&&saved.ch===ch?saved.y||0:0;requestAnimationFrame(()=>window.scrollTo(0,y));
 rdState={id,ch,n:b.chapters.length};updatePct();
 document.getElementById("mk").onclick=()=>{(marks[id]=marks[id]||[]).unshift({ch,y:window.scrollY,ts:Date.now()});marks[id]=marks[id].slice(0,30);SS("bibli.marks",marks);toast(t("bookmarked"))};
 document.getElementById("aa").onclick=settings;}
function updatePct(){if(!rdState)return;const h=document.documentElement;const f=h.scrollHeight>h.clientHeight?window.scrollY/(h.scrollHeight-h.clientHeight):1;const pct=Math.round(((rdState.ch+Math.min(1,f))/rdState.n)*100);document.getElementById("pct").textContent=pct+" %";document.getElementById("topline").style.width=pct+"%";progress[rdState.id]={ch:rdState.ch,y:window.scrollY,pct,at:Date.now()};}
let lastY=0;window.addEventListener("scroll",()=>{if(!rdState)return;updatePct();const y=window.scrollY;document.body.classList.toggle("hide",y>lastY+10&&y>80);if(y<lastY-10)document.body.classList.remove("hide");lastY=y;clearTimeout(window._ps);window._ps=setTimeout(()=>SS("bibli.progress",progress),400)},{passive:true});
window.addEventListener("pagehide",()=>SS("bibli.progress",progress));
function settings(){const d=document.createElement("div");d.className="sheet";d.innerHTML=`<div><h2>${t("settings")}</h2><div class="sub">${t("size")}</div><div class="opts">${[15,17,19,22].map(s=>`<button class="pill ${prefs.size===s?"on":""}" data-s="${s}">${s}</button>`).join("")}</div><div class="sub">${t("theme")}</div><div class="opts">${[["light","light"],["sepia","sepia"],["dark","dark"]].map(([k,n])=>`<button class="pill ${prefs.theme===k?"on":""}" data-t="${k}">${t(n)}</button>`).join("")}</div></div>`;
 d.onclick=e=>{const b=e.target.closest("button");if(!b){if(e.target===d)d.remove();return}if(b.dataset.s)prefs.size=+b.dataset.s;if(b.dataset.t)prefs.theme=b.dataset.t;SS("bibli.prefs",prefs);applyTheme();d.querySelectorAll("button").forEach(x=>x.classList.toggle("on",(x.dataset.s&&+x.dataset.s===prefs.size)||(x.dataset.t===prefs.theme)))};document.body.appendChild(d)}

async function mine(){await loadCat();const ids=Object.entries(progress).sort((a,b)=>b[1].at-a[1].at).map(([id])=>id).filter(id=>BOOKS[id]);
 const mk=Object.entries(marks).filter(([id,m])=>BOOKS[id]&&m.length);
 app.innerHTML=`<h1>${t("mine_h")}</h1><p class="sub">${t("mine_sub")}</p>${ids.length?`<div class="grid">${ids.map(id=>card(BOOKS[id])).join("")}</div>`:`<div class="empty">${t("mine_none")}</div>`}
 ${mk.length?`<h2>${t("marks")}</h2><ol class="toc">${mk.flatMap(([id,m])=>m.slice(0,5).map(x=>`<li><a href="#/read/${id}/${x.ch}" onclick="setTimeout(()=>scrollTo(0,${x.y}),300)"><span class="n">${x.ch+1}</span><span>${esc(BOOKS[id].title)} — ${esc(BOOKS[id].chapters[x.ch]||t("chapter")+" "+(x.ch+1))}</span></a></li>`)).join("")}</ol>`:""}`}

async function about(){const c=await loadCat();const fr=c.books.filter(b=>b.lang==="fr").length;
 app.innerHTML=`<div class="about"><h1>${t("about")}</h1><div class="kpi"><div><b>${c.books.length}</b><span>${t("results")(c.books.length).replace(/^\d+\s/,"")}</span></div><div><b>${fr}</b><span>${t("langs").fr}</span></div><div><b>${c.books.length-fr}</b><span>${t("langs").en}</span></div></div><p>${t("about_t")}</p><p class="note">${t("legal")} — life + 70 (France, Côte d'Ivoire, EU). ${t("source")} : <a href="https://www.gutenberg.org/policy/license.html" rel="noopener">Project Gutenberg License</a>.</p></div>`}

// ------------------------------------------------------------ router
async function route(){const h=location.hash||"#/";const [path,qs]=h.slice(1).split("?");const q=new URLSearchParams(qs||"");const seg=path.split("/").filter(Boolean);
 rdState=null;document.body.classList.remove("reading","hide");document.getElementById("topline").style.width=0;
 try{
 if(seg[0]==="catalogue")await catalogue(q);else if(seg[0]==="book")await book(seg[1]);else if(seg[0]==="read")await read(seg[1],seg[2]);else if(seg[0]==="mine")await mine();else if(seg[0]==="about")await about();else await home();
 }catch(e){app.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
 if(seg[0]!=="read")window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
applyTheme();setLang(L);
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
