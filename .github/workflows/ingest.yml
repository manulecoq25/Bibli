name: Ingest books

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Books per language"
        default: "100"
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC: pick up new Gutenberg titles

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull public-domain books from Project Gutenberg
        run: |
          N="${{ github.event.inputs.count || '100' }}"
          set -o pipefail
          { curl -sS -o /dev/null -w "gutendex %{http_code}\n" https://gutendex.com/books/4650 || true
            curl -sS -o /dev/null -w "gutenberg %{http_code}\n" https://www.gutenberg.org/cache/epub/4650/pg4650.txt || true
            curl -sS -o /dev/null -w "aleph %{http_code}\n" https://aleph.gutenberg.org/cache/epub/4650/pg4650.txt || true
            python3 tools/ingest.py --from-file tools/seed-fr.txt
            python3 tools/ingest.py --from-file tools/seed-en.txt
            python3 tools/ingest.py --from-file tools/seed-dev.txt
            python3 tools/ingest.py --lang fr --count "$N"
            python3 tools/ingest.py --lang en --count "$N"
          } 2>&1 | tee tools/last-run.log
      - name: Commit the catalogue
        if: always()
        run: |
          git config user.name "bibli-bot"
          git config user.email "bibli-bot@users.noreply.github.com"
          git add site/data tools/last-run.log
          git diff --cached --quiet || git commit -m "data: refresh catalogue ($(date -u +%F))"
          git push
